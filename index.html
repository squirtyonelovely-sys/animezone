<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeZone</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0912;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#151020;border-bottom:1px solid #35234d}
.logo{font-size:28px;font-weight:900;color:#c084fc}
.logo span{color:white}
header p,.sub{color:#b8a9ca}
main{padding:25px 5%;max-width:1200px;margin:auto}
h1{font-size:32px;margin-bottom:8px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #49345f;background:#191322;color:white;font-size:16px;margin:20px 0}
#status{color:#c4b5fd;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#191322;border:1px solid #30223f;border-radius:14px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#251b32}
.info{padding:12px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#c4b5fd;line-height:1.5}
button,.more{display:inline-block;background:#9333ea;color:white;border:0;border-radius:9px;padding:10px 12px;margin-top:10px;font-weight:bold;text-decoration:none;cursor:pointer}
footer{text-align:center;padding:30px;color:#9b8cae}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:42px}}
</style>
</head>

<body>
<header>
  <div class="logo">Anime<span>Zone</span> 🍥</div>
  <p>Твоя территория аниме</p>
</header>

<main>
  <h1>Открой свой мир аниме</h1>
  <p class="sub">Ищи любимые тайтлы и открывай новые истории.</p>
  <input id="search" placeholder="🔎 Найти аниме..." autocomplete="off">
  <div id="status">Подключаемся к каталогу...</div>
  <div class="grid" id="catalog"></div>
</main>

<footer>AnimeZone · Данные об аниме предоставляются Kitsu API.</footer>

<script>
const catalog = document.getElementById('catalog');
const status = document.getElementById('status');
const search = document.getElementById('search');

let animeList = [];

async function loadAnime() {
  status.textContent = 'Загружаем каталог...';
  status.textContent = 'JavaScript запущен. Проверяем API...';
  try {
    const response = await fetch(
  'https://kitsu.io/api/edge/anime?sort=popularityRank&page%5Blimit%5D=5'
);

if (!response.ok) {
      throw new Error('Ошибка сервера: ' + response.status);
    }

    const result = await response.json();

    animeList = (result.data || []).map(item => {
      const a = item.attributes || {};

      return {
        title: a.canonicalTitle || 'Без названия',
        image: a.posterImage?.large || a.posterImage?.medium || '',
        score: a.averageRating
          ? (Number(a.averageRating) / 10).toFixed(1)
          : '—',
        year: a.startDate ? a.startDate.slice(0, 4) : '—',
        synopsis: a.synopsis || 'Описание отсутствует',
        url: 'https://kitsu.io/anime/' + item.id
      };
    });

    render();
  } catch (error) {
    console.error(error);
    status.textContent = 'Не удалось загрузить каталог: ' + error.message;

    const retry = document.createElement('button');
    retry.textContent = 'Попробовать снова';
    retry.onclick = loadAnime;
    status.appendChild(document.createElement('br'));
    status.appendChild(retry);
  }
}

function render() {
  const query = search.value.trim().toLowerCase();

  const filtered = animeList.filter(anime =>
    anime.title.toLowerCase().includes(query)
  );

  catalog.replaceChildren();

  if (filtered.length === 0) {
    status.textContent = animeList.length
      ? 'Ничего не найдено.'
      : 'Каталог пока пуст.';
    return;
  }

  status.textContent = 'Найдено аниме: ' + filtered.length;

  filtered.forEach(anime => {
    const card = document.createElement('article');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = anime.image;
    img.alt = anime.title;
    img.loading = 'lazy';

    const info = document.createElement('div');
    info.className = 'info';

    const title = document.createElement('h3');
    title.textContent = anime.title;

    const description = document.createElement('p');
    description.textContent =
      anime.year + ' · Рейтинг: ' + anime.score;

    const synopsis = document.createElement('p');
    synopsis.textContent = anime.synopsis.length > 160
      ? anime.synopsis.slice(0, 160) + '…'
      : anime.synopsis;

    const link = document.createElement('a');
    link.className = 'more';
    link.href = anime.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Подробнее';

    info.append(title, description, synopsis, link);
    card.append(img, info);
    catalog.appendChild(card);
  });
}

search.addEventListener('input', () => {
  render();
});

let searchTimer;

search.addEventListener('input', () => {
  clearTimeout(searchTimer);

  const query = search.value.trim();

  if (!query) {
    loadAnime();
    return;
  }

  searchTimer = setTimeout(async () => {
    status.textContent = 'Ищем аниме...';

    try {
      const url =
        'https://kitsu.io/api/edge/anime?filter[text]=' +
        encodeURIComponent(query) +
        '&page[limit]=20&sort=popularityRank';

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error('Ошибка сервера: ' + response.status);
      }

      const result = await response.json();

      animeList = (result.data || []).map(item => {
        const a = item.attributes || {};

        return {
          title: a.canonicalTitle || 'Без названия',
          image: a.posterImage?.large || a.posterImage?.medium || '',
          score: a.averageRating
            ? (Number(a.averageRating) / 10).toFixed(1)
            : '—',
          year: a.startDate ? a.startDate.slice(0, 4) : '—',
          synopsis: a.synopsis || 'Описание отсутствует',
          url: 'https://kitsu.io/anime/' + item.id
        };
      });

      render();
    } catch (error) {
      console.error(error);
      status.textContent = 'Ошибка поиска. Попробуй ещё раз.';
    }
  }, 400);
});

search.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    search.value = '';
    clearTimeout(searchTimer);
    loadAnime();
    search.blur();
  }
});
loadAnime();
</script>
</body>
</html>
