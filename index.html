<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0912;color:white;font-family:Arial,sans-serif}
header{padding:22px 5%;background:#151020;border-bottom:1px solid #35234d}
.logo{font-size:28px;font-weight:900;color:#c084fc}
.logo span{color:white}
header p{color:#b8a9ca;margin-bottom:0}
main{padding:25px 5%;max-width:1200px;margin:auto}
h1{font-size:32px;margin-bottom:8px}
.sub{color:#b8a9ca}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #49345f;background:#191322;color:white;font-size:16px;margin:20px 0}
#status{color:#c4b5fd;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#191322;border:1px solid #30223f;border-radius:14px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#251b32}
.info{padding:12px}
.info h3{font-size:15px;margin:0 0 8px}
.info p{font-size:12px;color:#c4b5fd;margin:0}
button{background:#9333ea;color:white;border:0;border-radius:9px;padding:10px 12px;margin-top:10px;font-weight:bold}
footer{text-align:center;padding:30px;color:#9b8cae}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:42px}}
</style>
</head>
<body>
<header>
<div class="logo">Anime<span>Zone</span> 🍥</div>
<p>Твоя территория аниме</p>
</header>
<main>
<h1>Открой свой мир аниме</h1>
<p class="sub">Ищи любимые тайтлы и открывай новые истории.</p>
<input id="search" placeholder="🔎 Найти аниме..." autocomplete="off">
<div id="status">Загружаем каталог...</div>
<div class="grid" id="catalog"></div>
</main>
<footer>AnimeZone · Информация об аниме предоставляется Jikan API.</footer>
<script>
const catalog=document.getElementById('catalog');
const status=document.getElementById('status');
const search=document.getElementById('search');
let animeList=[];
async function loadAnime(){
  status.textContent='Загружаем настоящие аниме...';

  try {
    const response = await fetch(
      'https://kitsu.io/api/edge/anime?page[limit]=24&sort=popularityRank'
    );

    if (!response.ok) {
      throw new Error('Ошибка загрузки: ' + response.status);
    }

    const result = await response.json();

    animeList = (result.data || []).map(item => {
      const a = item.attributes || {};

      return {
        title: a.canonicalTitle || a.titles?.en || 'Без названия',
        title_english: a.titles?.en_jp || '',
        year: a.startDate ? a.startDate.slice(0, 4) : null,
        score: a.averageRating ? (Number(a.averageRating) / 10).toFixed(1) : null,
        episodes: a.episodeCount,
        synopsis: a.synopsis,
        images: {
          jpg: {
            large_image_url: a.posterImage?.large || a.posterImage?.original || ''
          }
        }
      };
    });

    render();

  } catch (e) {
    status.textContent = 'Не удалось загрузить каталог. Попробуй ещё раз.';
    console.error(e);

    const retry = document.createElement('button');
    retry.textContent = 'Попробовать снова';
    retry.onclick = loadAnime;
    status.appendChild(document.createElement('br'));
    status.appendChild(retry);
  }
}
status.textContent='Загружаем настоящие аниме...';
try{
const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 10000);

let response;

try {
  response = await fetch(
    'https://api.jikan.moe/v4/top/anime?limit=24',
    { signal: controller.signal }
  );
} finally {
  clearTimeout(timeout);
}
if(!response.ok)throw new Error('Ошибка загрузки');
const data=await response.json();
animeList=data.data||[];
render();
}catch(e){
status.textContent='Не удалось загрузить каталог. Проверь интернет и нажми кнопку.';
const retry=document.createElement('button');
retry.textContent='Попробовать снова';
retry.onclick=loadAnime;
status.appendChild(document.createElement('br'));
status.appendChild(retry);
}
}
function render(){
  if(animeList.length===0){
status.textContent='Каталог пока не загрузился. Проверь подключение к API.';
return;
}

const q=search.value.trim().toLowerCase();
const filtered=animeList.filter(a=>(a.title||'').toLowerCase().includes(q)||(a.title_english||'').toLowerCase().includes(q));
catalog.replaceChildren();
status.textContent=filtered.length?'Найдено аниме: '+filtered.length:'Ничего не найдено.';
filtered.forEach(a=>{
const card=document.createElement('article');
card.className='card';
const img=document.createElement('img');
img.src=a.images?.jpg?.large_image_url||a.images?.jpg?.image_url||'';
img.alt=a.title||'Обложка аниме';
img.loading='lazy';
const info=document.createElement('div');
info.className='info';
const title=document.createElement('h3');
title.textContent=a.title||'Без названия';
const desc=document.createElement('p');
desc.textContent=(a.year||'Год неизвестен')+' · '+(a.score?'Рейтинг '+a.score:'Без рейтинга');
const btn=document.createElement('button');
btn.textContent='Подробнее';
btn.onclick=()=>{
alert((a.title||'Аниме')+'\n\n'+(a.synopsis||'Описание пока недоступно.')+'\n\nЭпизодов: '+(a.episodes??'неизвестно')+'\n\nВидео не подключено. Для просмотра нужен легальный источник.');
};
info.append(title,desc,btn);
card.append(img,info);
catalog.append(card);
});
}
search.addEventListener('input',render);
loadAnime();
</script>
</body>
</html>
