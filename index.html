<!DOCTYPE html>
<html lang="ru">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://qxwfceyxnmcqbjktuihc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_aY40-eF7jePQp_vkOle49g_3ySknNWt';

  const supabaseClient = window.supabase.createClient(

  );
</script>
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeZone</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0912;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px 5%;
  background: #151020;
  border-bottom: 1px solid #35234d;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  color: #c084fc;
}

.logo span { color: white; }

header p, .sub { color: #b8a9ca; }

main {
  padding: 25px 5%;
  max-width: 1200px;
  margin: auto;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #49345f;
  background: #191322;
  color: white;
  font-size: 16px;
  margin: 20px 0;
}

#status {
  color: #c4b5fd;
  margin: 12px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  background: #191322;
  border: 1px solid #30223f;
  border-radius: 14px;
  overflow: hidden;
}

.card img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  background: #251b32;
}

.info { padding: 12px; }

.info h3 {
  font-size: 15px;
  margin: 0 0 8px;
}

.info p {
  font-size: 12px;
  color: #c4b5fd;
  line-height: 1.5;
}

button, .more {
  display: inline-block;
  background: #9333ea;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 10px 12px;
  margin-top: 10px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
}

.genres {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 20px;
}

.genre-btn {
  background: #191322;
  color: #d8b4fe;
  border: 1px solid #49345f;
  border-radius: 20px;
  padding: 10px 15px;
  cursor: pointer;
}

.genre-btn:hover,
.genre-btn.active {
  background: #9333ea;
  color: white;
  border-color: #c084fc;
}

.genre-btn:focus { outline: none; }

.genre-btn:focus-visible {
  outline: 2px solid #c084fc;
  outline-offset: 3px;
}
.favorite-btn {
  display: block;
  width: 100%;
  background: #30223f;
  color: #f0abfc;
  border: 1px solid #49345f;
  border-radius: 9px;
  padding: 10px;
  margin-top: 8px;
  font-weight: bold;
  cursor: pointer;
}

.favorite-btn.active {
  background: #7e22ce;
  color: white;
  border-color: #c084fc;
}
.details {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  margin-top: 25px;
  background: #191322;
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #49345f;
}

.details img {
  width: 100%;
  max-width: 320px;
  border-radius: 12px;
}

.details h2 {
  color: #c084fc;
  font-size: 28px;
}

.details p {
  line-height: 1.8;
  color: #ddd0ee;
}

.back-button {
  display: inline-block;
  background: #9333ea;
  color: white;
  padding: 12px 18px;
  border-radius: 9px;
  text-decoration: none;
  margin-bottom: 20px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #9b8cae;
}

@media (min-width: 650px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  h1 { font-size: 42px; }
  .details { grid-template-columns: 300px 1fr; }
}
</style>
</head>

<body>
<header>
  <div class="logo">Anime<span>Zone</span> 🍥</div>
  <p>Твоя территория аниме</p>
</header>

<main id="main">
  <h1>Открой свой мир аниме</h1>
  <p class="sub">Ищи любимые тайтлы и открывай новые истории.</p>

  <input id="search" placeholder="🔎 Найти аниме..." autocomplete="off">

  <div class="genres">
    <button class="genre-btn active" data-genre="">Все</button>
    <button class="genre-btn" data-genre="action">⚔️ Экшен</button>
    <button class="genre-btn" data-genre="romance">❤️ Романтика</button>
    <button class="genre-btn" data-genre="comedy">😂 Комедия</button>
    <button class="genre-btn" data-genre="fantasy">🪄 Фэнтези</button>
    <button class="genre-btn" data-genre="horror">👻 Ужасы</button>
  </div>

  <div id="status">Подключаемся к каталогу...</div>
  <div class="grid" id="catalog"></div>
</main>

<footer>AnimeZone · Данные об аниме предоставляются Kitsu API.</footer>
<script>
const catalog = document.getElementById('catalog');
const status = document.getElementById('status');
const search = document.getElementById('search');
const main = document.getElementById('main');

let animeList = [];
  let favorites = JSON.parse(
  localStorage.getItem('animeFavorites') || '[]'
);
let selectedGenre = '';
let searchTimer;
let requestNumber = 0;

const genreMap = {
  action: 'action',
  romance: 'romance',
  comedy: 'comedy',
  fantasy: 'fantasy',
  horror: 'horror'
};

function mapAnime(item) {
  const a = item.attributes || {};

  return {
    id: item.id,
    title: a.canonicalTitle || 'Без названия',
    image: a.posterImage?.large || a.posterImage?.medium || '',
    score: a.averageRating
      ? (Number(a.averageRating) / 10).toFixed(1)
      : '—',
    year: a.startDate ? a.startDate.slice(0, 4) : '—',
    synopsis: a.synopsis || 'Описание отсутствует'
  };
}

async function loadAnime() {
  const currentRequest = ++requestNumber;

  status.textContent = 'Загружаем каталог...';
  catalog.replaceChildren();

  try {
    const apiUrl = new URL('https://kitsu.io/api/edge/anime');

    apiUrl.searchParams.set('sort', 'popularityRank');
    apiUrl.searchParams.set('page[limit]', '20');

    if (selectedGenre) {
      apiUrl.searchParams.set(
        'filter[genres]',
        genreMap[selectedGenre]
      );
    }

    const query = search.value.trim();

    if (query) {
      apiUrl.searchParams.set('filter[text]', query);
    }

    const response = await fetch(apiUrl.toString());

    if (!response.ok) {
      throw new Error('Ошибка сервера: ' + response.status);
    }

    const result = await response.json();

    if (currentRequest !== requestNumber) return;

    animeList = (result.data || []).map(mapAnime);
    render();

  } catch (error) {
    if (currentRequest !== requestNumber) return;

    console.error(error);
    status.textContent = 'Не удалось загрузить каталог. Попробуй ещё раз.';

    const retry = document.createElement('button');
    retry.textContent = 'Попробовать снова';
    retry.addEventListener('click', loadAnime);
    status.appendChild(document.createElement('br'));
    status.appendChild(retry);
  }
}

function render() {
  const query = search.value.trim().toLowerCase();

  const filtered = animeList.filter(anime =>
    anime.title.toLowerCase().includes(query)
  );

  catalog.replaceChildren();

  if (filtered.length === 0) {
    status.textContent = animeList.length
      ? 'Ничего не найдено.'
      : 'В этом разделе пока ничего нет.';
    return;
  }

  status.textContent = 'Найдено аниме: ' + filtered.length;

  filtered.forEach(anime => {
    const card = document.createElement('article');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = anime.image;
    img.alt = anime.title;
    img.loading = 'lazy';

    const info = document.createElement('div');
    info.className = 'info';

    const title = document.createElement('h3');
    title.textContent = anime.title;

    const description = document.createElement('p');
    description.textContent =
      anime.year + ' · Рейтинг: ' + anime.score;

    const synopsis = document.createElement('p');
    synopsis.textContent = anime.synopsis.length > 160
      ? anime.synopsis.slice(0, 160) + '…'
      : anime.synopsis;

    const link = document.createElement('a');
    link.className = 'more';
    link.href = '?anime=' + encodeURIComponent(anime.title);
    link.textContent = 'Подробнее';
const favoriteBtn = document.createElement('button');
favoriteBtn.className = 'favorite-btn';
favoriteBtn.textContent = '❤️ В избранное';
    if (favorites.includes(String(anime.id))) {
  favoriteBtn.classList.add('active');
  favoriteBtn.textContent = '💜 В избранном';
}

favoriteBtn.addEventListener('click', () => {
  const id = String(anime.id);

  if (favorites.includes(id)) {
    favorites = favorites.filter(favoriteId => favoriteId !== id);
    favoriteBtn.classList.remove('active');
    favoriteBtn.textContent = '❤️ В избранное';
  } else {
    favorites.push(id);
    favoriteBtn.classList.add('active');
    favoriteBtn.textContent = '💜 В избранном';
  }

  localStorage.setItem('animeFavorites', JSON.stringify(favorites));
});
    info.append(title, description, synopsis, link, favoriteBtn);
    card.append(img, info);
    catalog.appendChild(card);
  });
}

document.querySelectorAll('.genre-btn').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.genre-btn').forEach(btn => {
      btn.classList.remove('active');
    });

    button.classList.add('active');
    selectedGenre = button.dataset.genre;
    search.value = '';

    clearTimeout(searchTimer);
    loadAnime();
  });
});

search.addEventListener('input', () => {
  clearTimeout(searchTimer);

  searchTimer = setTimeout(() => {
    loadAnime();
  }, 400);
});

search.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    search.value = '';
    clearTimeout(searchTimer);
    loadAnime();
    search.blur();
  }
});
  async function openAnimePage() {
  const params = new URLSearchParams(window.location.search);
  const animeTitle = params.get('anime');

  if (!animeTitle) return;

  main.innerHTML = `
    <a class="back-button" href="./">← Назад в каталог</a>
    <div id="animeDetails">Загружаем информацию об аниме...</div>
  `;

  try {
    const apiUrl = new URL('https://kitsu.io/api/edge/anime');
    apiUrl.searchParams.set('filter[text]', animeTitle);
    apiUrl.searchParams.set('page[limit]', '20');

    const response = await fetch(apiUrl.toString());

    if (!response.ok) {
      throw new Error('Ошибка сервера: ' + response.status);
    }

    const result = await response.json();

const items = result.data || [];

const normalizeTitle = title =>
  (title || '')
    .toLowerCase()
    .replace(/[^a-z0-9а-яё]/gi, '');

const wantedTitle = normalizeTitle(animeTitle);

const anime = items.find(item => {
  const a = item.attributes || {};
  const titles = [
    a.canonicalTitle,
    a.titles?.en,
    a.titles?.en_jp,
    a.titles?.ja_jp
  ];

  return titles.some(title =>
    normalizeTitle(title) === wantedTitle
  );
}) || items[0];
    const container = document.getElementById('animeDetails');

    if (!anime) {
      container.textContent = 'Аниме не найдено.';
      return;
    }

    const a = anime.attributes || {};

    const details = document.createElement('div');
    details.className = 'details';

    const poster = document.createElement('img');
    poster.src = a.posterImage?.large || a.posterImage?.medium || '';
    poster.alt = a.canonicalTitle || 'Постер аниме';

    const info = document.createElement('div');

    const title = document.createElement('h2');
    title.textContent = a.canonicalTitle || 'Без названия';

    const year = document.createElement('p');
    year.textContent = 'Год выпуска: ' +
      (a.startDate ? a.startDate.slice(0, 4) : 'Неизвестен');

    const rating = document.createElement('p');
    rating.textContent = 'Рейтинг: ' +
      (a.averageRating
        ? (Number(a.averageRating) / 10).toFixed(1) + '/10'
        : 'Нет рейтинга');

    const synopsis = document.createElement('p');
    synopsis.textContent = a.synopsis || 'Описание пока отсутствует.';

    info.append(title, year, rating, synopsis);
details.append(poster, info);
container.appendChild(details);

const watchSection = document.createElement('section');
watchSection.style.marginTop = '30px';

const watchTitle = document.createElement('h2');
watchTitle.textContent = '📺 Смотреть онлайн';

const watchMessage = document.createElement('p');
watchMessage.textContent =
  'Раздел просмотра готовится. Источник видео подключим следующим шагом.';

watchMessage.style.color = '#c4b5fd';

const episodeList = document.createElement('div');
episodeList.id = 'episode-list';

const player = document.createElement('div');
player.id = 'anime-player';
player.style.width = '100%';
player.style.aspectRatio = '16 / 9';
player.style.background = '#000';
player.style.borderRadius = '12px';
player.style.display = 'flex';
player.style.alignItems = 'center';
player.style.justifyContent = 'center';
player.style.color = '#c4b5fd';
player.textContent = '🎬 Здесь будет видеоплеер';

watchSection.append(watchTitle, watchMessage, episodeList, player);
container.appendChild(watchSection);

  } catch (error) {
    const container = document.getElementById('animeDetails');

    if (container) {
      container.textContent =
        'Не удалось загрузить информацию. Попробуй обновить страницу.';
    }

    console.error(error);
  }
}

if (new URLSearchParams(window.location.search).has('anime')) {
  openAnimePage();
} else {
  loadAnime();
}

</script>
  <div id="auth-box">
  <h2>AnimeZone — аккаунт</h2>

  <input id="auth-email" type="email" placeholder="Твоя почта">
  <input id="auth-password" type="password" placeholder="Пароль">

  <button onclick="registerUser()">Регистрация</button>
  <button onclick="loginUser()">Войти</button>
  <button onclick="logoutUser()">Выйти</button>

  <p id="auth-message"></p>
</div>

<script>
async function registerUser() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const message = document.getElementById('auth-message');

  const { error } = await supabaseClient.auth.signUp({
    email,
    password
  });

  message.textContent = error
    ? error.message
    : 'Регистрация отправлена! Проверь почту для подтверждения.';
}

async function loginUser() {
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const message = document.getElementById('auth-message');

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  message.textContent = error
    ? error.message
    : 'Ты успешно вошёл в аккаунт!';
}

async function logoutUser() {
  const { error } = await supabaseClient.auth.signOut();

  document.getElementById('auth-message').textContent = error
    ? error.message
    : 'Ты вышел из аккаунта.';
}
</script>
</body>
</html>
